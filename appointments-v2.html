<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torklio — Appointments Scheduler (Workflow Board)</title>
<link rel="stylesheet" href="style.css">
<style>
  /* page-scoped LAYOUT only, classes prefixed sched2- so nothing here can
     leak into / be affected by the live appointments.html's styles. */
  .sched2-layout{display:grid;grid-template-columns:1fr 360px;gap:var(--s4);align-items:start}
  @media(max-width:1100px){.sched2-layout{grid-template-columns:1fr}}
  .sched2-toolbar{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
  .sched2-toolbar-left{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
  .sched2-viewbtns{display:inline-flex;gap:2px;background:var(--canvas);border:1px solid var(--rule);border-radius:var(--r-md);padding:3px}
  .sched2-viewbtns button{padding:7px 14px;border-radius:var(--r-chip);font-size:var(--t-13);font-weight:600;color:var(--ink-3)}
  .sched2-viewbtns button.active{background:var(--accent);color:#fff}
  .sched2-legend{display:flex;flex-wrap:wrap;gap:var(--s4);margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--rule)}
  .sched2-legend-item{display:flex;align-items:center;gap:6px;font-size:var(--t-13);color:var(--ink-3)}
  .sched2-chip{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .sched2-day-grid{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r-md);overflow:auto;max-height:640px}
  .sched2-card{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r-chip);padding:6px 8px;margin-bottom:4px;cursor:pointer;font-size:var(--t-13);transition:box-shadow .15s}
  .sched2-card:hover{box-shadow:var(--shadow-pop)}
  .sched2-card.dragging{opacity:.5}
  .sched2-week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s2)}
  .sched2-week-day{background:var(--canvas);border:1px solid var(--rule);border-radius:var(--r-md);padding:var(--s2);min-height:140px}
  .sched2-month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden}
  .sched2-month-cell{background:var(--card);min-height:84px;padding:6px;cursor:pointer;transition:background .15s}
  .sched2-month-cell:hover{background:var(--canvas)}
  .sched2-month-cell.other-month{background:#FAFBFC;color:var(--ink-4)}
  .sched2-month-cell.today{border:2px solid var(--accent)}
  .sched2-pending-card{border:1px solid var(--rule);border-radius:var(--r-md);padding:var(--s3);margin-bottom:var(--s2)}
  /* Workflow board */
  .wfb-board{display:flex;gap:var(--s3);overflow-x:auto;padding-bottom:var(--s2)}
  .wfb-col{flex:0 0 240px;background:var(--canvas);border-radius:var(--r-md);padding:var(--s3);min-height:140px;border-top:3px solid var(--rule)}
  .wfb-col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s3);padding-bottom:var(--s2);border-bottom:1px solid var(--rule)}
  .wfb-col-title{font-size:var(--t-13);font-weight:700;color:var(--ink)}
  .wfb-col.dragover{outline:2px dashed var(--accent);outline-offset:2px}
  .wfb-card{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r-md);padding:var(--s3);margin-bottom:var(--s2);cursor:pointer;font-size:var(--t-13);box-shadow:var(--shadow-card);transition:box-shadow .15s,transform .15s}
  .wfb-card:hover{box-shadow:var(--shadow-pop);transform:translateY(-1px)}
  .wfb-card.dragging{opacity:.5}
  .wfb-card .wfb-warn{font-size:var(--t-xs);color:var(--red);margin-top:4px}
</style>
</head>
<body>
<div class="app-shell">
  <nav class="icon-rail" id="icon-rail"></nav>

  <div class="main-col">
    <header class="app-header">
      <div>
        <div class="greeting-title">Appointments Scheduler</div>
        <div class="greeting-sub">Manage shop appointments, booking requests, and daily capacity.</div>
      </div>
      <div class="header-actions">
        <div class="search-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" placeholder="Search anything…">
        </div>
        <button class="icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        </button>
        <div class="avatar" id="avatar">J</div>
      </div>
    </header>

    <div class="page-body">
      <div id="locked-mount"></div>

      <div id="scheduler-root">
        <div id="summary-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3);margin-bottom:var(--s6)"></div>

        <div class="sched2-layout">
          <div class="card">
            <div class="card-head">
              <div class="card-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
                Daily Shop Workflow Board
              </div>
              <span class="muted" id="date-label" style="font-weight:600"></span>
            </div>
            <div class="card-body">
              <div class="sched2-toolbar">
                <div class="sched2-toolbar-left">
                  <button class="btn btn-secondary btn-sm" onclick="window.goPrevious()">← Prev</button>
                  <button class="btn btn-secondary btn-sm" onclick="window.goToday()">Today</button>
                  <button class="btn btn-secondary btn-sm" onclick="window.goNext()">Next →</button>
                  <input type="date" class="input" id="cal-date" style="width:auto">
                </div>
                <div class="sched2-viewbtns">
                  <button id="view-day">Day</button>
                  <button id="view-week">Week</button>
                  <button id="view-month">Month</button>
                </div>
              </div>
              <div class="sched2-toolbar" id="day-mode-row">
                <div class="sched2-viewbtns">
                  <button id="daymode-workflow">Workflow View</button>
                  <button id="daymode-calendar">Calendar View</button>
                </div>
              </div>

              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s2);margin-bottom:var(--s4)">
                <select class="select" id="filter-status">
                  <option value="">All Status</option>
                  <option value="scheduled">Scheduled</option>
                  <option value="waiting">Waiting</option>
                  <option value="in_progress">In Progress</option>
                  <option value="on_hold">On Hold</option>
                  <option value="ready">Ready</option>
                  <option value="cancelled">Cancelled</option>
                </select>
                <select class="select" id="filter-tech"><option value="">All Technicians</option></select>
                <select class="select" id="filter-bay"><option value="">All Bays</option></select>
                <select class="select" id="filter-type">
                  <option value="">All Types</option>
                  <option value="wait">Wait at shop</option>
                  <option value="drop_off">Drop-off</option>
                </select>
                <input type="search" class="input" id="filter-search" placeholder="Search customer, RO, vehicle…">
              </div>

              <div id="cal-body"></div>
              <div id="legend" class="sched2-legend"></div>
            </div>
          </div>

          <div class="stack">
            <div class="card">
              <div class="card-head">
                <div class="card-title">Pending Requests</div>
                <span class="badge badge-amber" id="pending-count">0</span>
              </div>
              <div class="card-body" id="pending-body"></div>
            </div>
            <div class="card">
              <div class="card-head"><div class="card-title">Waitlist</div></div>
              <div class="card-body" id="waitlist-body"></div>
            </div>
          </div>
        </div>

        <details class="card" id="admin-section" style="margin-top:var(--s6);padding:var(--s5)">
          <summary style="cursor:pointer;font-weight:700;font-size:var(--t-md)">Availability &amp; Scheduling Settings</summary>
          <div style="margin-top:var(--s5);display:grid;grid-template-columns:1fr 1fr;gap:var(--s6)">
            <div>
              <div class="section-label" style="margin-bottom:var(--s2)">Shop Hours</div>
              <div id="shop-hours-list"></div>
            </div>
            <div>
              <div class="section-label" style="margin-bottom:var(--s2)">Booking Rules</div>
              <div id="booking-rules-list"></div>
            </div>
          </div>
          <div style="margin-top:var(--s5)">
            <div class="section-label" style="margin-bottom:var(--s2)">Blocked Dates / Holidays</div>
            <div id="blocked-dates-note"></div>
          </div>
        </details>
      </div>
    </div>
  </div>
</div>

<div id="appt-drawer-overlay" class="overlay">
  <div class="drawer">
    <div class="modal-head">
      <div class="modal-title" id="drawer-title"></div>
      <button class="icon-btn" onclick="window.closeDrawer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body" id="drawer-body"></div>
  </div>
</div>

<script type="module">
  import { db } from './lib/data.js';
  db.init();
  import('./modules/appointments-v2.js').then((m) => m.renderAppointmentsV2());
</script>
</body>
</html>
