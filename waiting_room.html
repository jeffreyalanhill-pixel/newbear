<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torklio — Lobby Board</title>
<link rel="stylesheet" href="style.css">
<style>
  /* page-scoped LAYOUT + the sanctioned dark-theme exception (§5.0/§11.7):
     same font (Inter), same badge/card language, just darker + bigger for
     distance reading. No icon-rail — this is a customer-facing TV display. */
  body{background:var(--panel)}
  .board-wrap{padding:var(--s6);min-height:100vh;display:flex;flex-direction:column}
  .board-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s5)}
  .board-brand{color:#fff;font-size:var(--t-2xl);font-weight:800;display:flex;align-items:center;gap:var(--s3)}
  .board-clock{color:var(--panel-txt);text-align:right}
  .board-clock .time{font-size:var(--t-2xl);font-weight:700;font-variant-numeric:tabular-nums}
  .board-clock .updated{font-size:var(--t-13)}
  .board-grid{display:grid;grid-template-columns:35% 1fr;gap:var(--s5);flex:1}
  .now-serving{background:var(--panel-2);border:1px solid var(--panel-rule);border-radius:var(--r-panel);padding:var(--s6);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ns-ticket{color:var(--panel-txt);font-size:var(--t-md);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--s3)}
  .ns-make{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:var(--t-2xl);margin-bottom:var(--s4)}
  .ns-vehicle{color:#fff;font-size:var(--t-3xl);font-weight:800;margin-bottom:var(--s2)}
  .ns-name{color:var(--panel-txt);font-size:var(--t-lg);margin-bottom:var(--s4)}
  .ns-status{font-size:var(--t-xl);font-weight:700;padding:var(--s2) var(--s5);border-radius:var(--r-full)}
  .queue-panel{background:var(--panel-2);border:1px solid var(--panel-rule);border-radius:var(--r-panel);padding:var(--s5);display:flex;flex-direction:column}
  .queue-title{color:var(--panel-txt);font-size:var(--t-sm);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--s4)}
  .queue-row{display:grid;grid-template-columns:90px 1fr 1fr 1fr;gap:var(--s4);align-items:center;padding:var(--s4) 0;border-bottom:1px solid var(--panel-rule);font-size:var(--t-lg)}
  .queue-row:last-child{border-bottom:none}
  .queue-row.ready{color:#5CD98A}
  .queue-ticket{font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
  .queue-name{color:#fff}
  .queue-vehicle{color:var(--panel-txt)}
  .queue-next{font-weight:700;text-align:right}
  .board-foot{display:flex;justify-content:space-between;color:var(--panel-txt);font-size:var(--t-13);margin-top:var(--s5)}
</style>
</head>
<body>
<div class="board-wrap">
  <div class="board-top">
    <div class="board-brand">
      <svg viewBox="0 0 256 256" width="28" height="28" aria-hidden="true">
        <defs><linearGradient id="torklioBlueBoard" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7DD3FC"/><stop offset="50%" stop-color="#1E88FF"/><stop offset="100%" stop-color="#2563EB"/></linearGradient></defs>
        <circle cx="128" cy="132" r="62" fill="#071A3D"/>
        <circle cx="128" cy="132" r="34" fill="#FFFFFF"/>
        <path d="M 67 72 A 92 92 0 0 1 197 81" fill="none" stroke="url(#torklioBlueBoard)" stroke-width="18" stroke-linecap="butt"/>
        <path d="M 120 144 L 205 59 L 143 158 Z" fill="url(#torklioBlueBoard)"/>
        <circle cx="128" cy="132" r="13" fill="#FFFFFF" stroke="#1E88FF" stroke-width="5"/>
      </svg>
      <span id="shop-name">My Shop</span>
    </div>
    <div class="board-clock">
      <div class="time" id="clock"></div>
      <div class="updated" id="last-updated"></div>
    </div>
  </div>

  <div class="board-grid">
    <div class="now-serving" id="now-serving"></div>
    <div class="queue-panel">
      <div class="queue-title">Queue</div>
      <div id="queue-body" style="flex:1"></div>
    </div>
  </div>

  <div class="board-foot">
    <span>Thank you for your patience.</span>
    <span id="wifi-line"></span>
  </div>
</div>

<script type="module">
  import { db } from './lib/data.js';
  db.init();
  import('./modules/waiting-room.js').then(m => m.renderWaitingRoom());
</script>
</body>
</html>
