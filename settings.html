<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torklio — Settings</title>
<link rel="stylesheet" href="style.css">
<style>
  /* page-scoped LAYOUT only — §11.13. Technicians/Bays-as-employees already
     live in Team (Part B); Coupons moved conceptually to Marketing (Part D)
     but the underlying settings.coupons data is still managed here until a
     first-class Coupon entity exists. */
  .settings-tabs{margin-bottom:var(--s5)}
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:var(--s3);border:1px solid var(--rule);border-radius:var(--r-md);margin-bottom:var(--s2)}
  .item-row:last-child{margin-bottom:0}

  /* ── Integration Center ───────────────────────────────────────────────── */
  .integ-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:var(--s4);margin-bottom:var(--s5)}
  .integ-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
  .integ-card-icon{width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;margin-bottom:var(--s1);flex-shrink:0}
  .integ-card-name{font-weight:700;color:var(--ink);font-size:var(--t-md);line-height:1.2}
  .integ-card-desc{font-size:var(--t-13);color:var(--ink-3);flex:1;line-height:1.5}
  .integ-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:var(--s2);padding-top:var(--s2);border-top:1px solid var(--rule)}

  /* Zapier config */
  .event-group-label{font-size:var(--t-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:var(--s3) 0 var(--s2)}
  .event-group-label:first-child{margin-top:0}
  .event-check-row{display:flex;align-items:flex-start;gap:var(--s2);padding:var(--s2) 0;border-bottom:1px solid var(--rule)}
  .event-check-row:last-child{border-bottom:none}
  .event-check-desc{font-size:var(--t-xs);color:var(--ink-3);margin-top:2px}

  /* Test webhook result */
  .webhook-result{background:var(--canvas);border:1px solid var(--rule);border-radius:var(--r-md);padding:var(--s3);font-size:var(--t-13);margin-top:var(--s3);display:none}
  .webhook-result.visible{display:block}

  /* Payload preview modal */
  .payload-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center}
  .payload-modal{background:var(--card);border-radius:var(--r-card);padding:var(--s5);width:580px;max-width:calc(100vw - var(--s6));max-height:85vh;display:flex;flex-direction:column;gap:var(--s3);box-shadow:0 24px 64px rgba(0,0,0,.18)}
  .payload-json{background:var(--canvas);border:1px solid var(--rule);border-radius:var(--r-md);padding:var(--s3);font-family:'Space Mono',monospace;font-size:12px;color:var(--ink);overflow-y:auto;max-height:380px;white-space:pre;margin:0;line-height:1.6}
  .payload-note{font-size:var(--t-xs);color:var(--ink-3);padding:var(--s2) var(--s3);background:var(--canvas);border-radius:var(--r-md);border:1px solid var(--rule)}
</style>
</head>
<body>
<div class="app-shell">
  <nav class="icon-rail" id="icon-rail"></nav>

  <div class="main-col">
    <header class="app-header">
      <div>
        <div class="greeting-title">Settings</div>
        <div class="greeting-sub">Shop info, services, bays, and coupons.</div>
      </div>
      <div class="header-actions">
        <div class="avatar" id="avatar">J</div>
      </div>
    </header>

    <div class="page-body">
      <div class="seg settings-tabs" id="settings-tabs">
        <button data-view="shop">Shop</button>
        <button data-view="services">Services</button>
        <button data-view="bays">Bays</button>
        <button data-view="coupons">Coupons</button>
        <button data-view="roles">Roles &amp; Permissions</button>
        <button data-view="subscription">Subscription</button>
        <button data-view="rewards">Rewards</button>
        <button data-view="data">Data / Demo Reset</button>
        <button data-view="integrations">Integrations</button>
      </div>
      <div id="settings-view-body"></div>
    </div>
  </div>
</div>

<script type="module">
  import { db } from './lib/data.js';
  db.init();
  import('./modules/settings.js').then(m => m.renderSettings());
</script>
</body>
</html>
