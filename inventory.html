<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torklio — Inventory</title>
<link rel="stylesheet" href="style.css">
<style>
  /* page-scoped LAYOUT only — InventoryOps foundation. Sub-app: shared
     icon-rail + its own secondary tab nav + hash-routed views, same pattern
     as crm.html/quotes.html/team.html. */
  .inv-tabs{margin-bottom:var(--s5)}
  .qty-adjust{display:flex;align-items:center;gap:6px}
  .qty-adjust button{width:24px;height:24px;border-radius:6px;border:1px solid var(--rule);background:var(--card);font-weight:700}
  .qty-adjust button:hover{background:var(--canvas)}
  .loc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s2)}
  .loc-card{border:1px solid var(--rule);border-radius:var(--r-md);padding:var(--s3)}
</style>
</head>
<body>
<div class="app-shell">
  <nav class="icon-rail" id="icon-rail"></nav>

  <div class="main-col">
    <header class="app-header">
      <div>
        <div class="greeting-title">Inventory</div>
        <div class="greeting-sub">Parts, purchase orders, transfers, and returns across every location.</div>
      </div>
      <div class="header-actions">
        <span id="inv-share-mount"></span>
        <div class="avatar" id="avatar">J</div>
      </div>
    </header>

    <div class="page-body">
      <div id="inv-banner" style="margin-bottom:var(--s4)"></div>
      <div class="seg inv-tabs" id="inv-tabs">
        <button data-view="dashboard">Dashboard</button>
        <button data-view="stock">Stock</button>
        <button data-view="purchase-orders">Purchase Orders</button>
        <button data-view="transfers">Transfers</button>
        <button data-view="returns-counts">Returns &amp; Counts</button>
        <button data-view="suppliers">Suppliers &amp; Integrations</button>
      </div>
      <div id="inv-view-body"></div>
    </div>
  </div>
</div>

<div class="overlay" id="inv-overlay">
  <div class="drawer" id="inv-drawer"></div>
</div>

<script type="module">
  import { db } from './lib/data.js';
  db.init();
  import('./modules/inventory/inventory-app.js').then(m => m.renderInventoryApp());
</script>
</body>
</html>
