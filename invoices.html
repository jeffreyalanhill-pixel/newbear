<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoBook — Invoices</title>
<link rel="stylesheet" href="style.css">
<style>
  /* page-scoped LAYOUT only — §11.10 */
  .filters-row{display:flex;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
  .filters-row .select{width:auto;min-width:140px}
  .inv-detail-section{padding:var(--s4) 0;border-bottom:1px solid var(--rule)}
  .inv-detail-section:last-child{border-bottom:none}
  .inv-detail-section h4{font-size:var(--t-sm);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:var(--s3)}
  .inv-print-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:var(--s4)}
  .inv-li-row{display:grid;grid-template-columns:1fr 50px 80px 80px;gap:var(--s2);padding:6px 0;font-size:var(--t-13)}
  .inv-li-row.head{color:var(--ink-4);font-size:var(--t-xs);text-transform:uppercase}
  .inv-totals{display:flex;flex-direction:column;gap:4px;align-items:flex-end;margin-top:var(--s3);font-size:var(--t-13)}
  .inv-totals .grand{font-size:var(--t-lg);font-weight:800;color:var(--ink)}
  .payment-row{display:flex;justify-content:space-between;padding:var(--s2) 0;border-bottom:1px solid var(--rule);font-size:var(--t-13)}
  .payment-row:last-child{border-bottom:none}
  @media print{
    .icon-rail,.app-header,.filters-row,.modal-foot,#close-drawer,.inv-no-print{display:none!important}
    .drawer{position:static;width:100%;box-shadow:none;border:none}
    .overlay{position:static;background:none;backdrop-filter:none}
    body{background:#fff}
  }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="icon-rail" id="icon-rail"></nav>

  <div class="main-col">
    <header class="app-header">
      <div>
        <div class="greeting-title">Invoices</div>
        <div class="greeting-sub">Billing list, payments, and balances.</div>
      </div>
      <div class="header-actions">
        <div class="search-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="Search invoice, customer…">
        </div>
        <button class="icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        </button>
        <div class="avatar" id="avatar">J</div>
      </div>
    </header>

    <div class="page-body">
      <div class="card">
        <div class="card-body">
          <div class="filters-row">
            <select class="select" id="filter-status">
              <option value="">All statuses</option>
              <option value="draft">Draft</option>
              <option value="sent">Sent</option>
              <option value="partial">Partial</option>
              <option value="paid">Paid</option>
              <option value="overdue">Overdue</option>
            </select>
          </div>
          <table class="table" id="inv-table">
            <thead>
              <tr><th>Number</th><th>Customer</th><th>Vehicle</th><th>Issued</th><th class="num">Total</th><th class="num">Balance</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="inv-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="inv-overlay">
  <div class="drawer" id="inv-drawer"></div>
</div>

<script type="module">
  import { db } from './lib/data.js';
  db.init();
  import('./modules/invoices.js').then(m => m.renderInvoices());
</script>
</body>
</html>
