<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoBook — Appointments</title>
<link rel="stylesheet" href="style.css">
<style>
  /* page-scoped LAYOUT only — §11.5 */
  .appt-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:var(--s4);align-items:start}
  @media(max-width:1000px){.appt-grid{grid-template-columns:1fr}}
  .booking-card{border:1px solid var(--rule);border-radius:var(--r-md);padding:var(--s4);margin-bottom:var(--s3)}
  .booking-card:last-child{margin-bottom:0}
  .booking-card .bc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:var(--s2)}
  .booking-card .bc-name{font-weight:700;color:var(--ink)}
  .booking-card .bc-sub{font-size:var(--t-13);color:var(--ink-3)}
  .booking-card .bc-meta{display:flex;flex-wrap:wrap;gap:6px;margin:var(--s2) 0}
  .booking-card .bc-actions{display:flex;gap:var(--s2);margin-top:var(--s3)}
  .day-toggle-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)}
  .sched-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border:1px solid var(--rule);border-radius:var(--r-md);margin-bottom:var(--s2);cursor:pointer;transition:border-color .15s}
  .sched-row:hover{border-color:var(--accent-mid)}
  .sched-time{font-weight:700;color:var(--ink);width:78px;flex-shrink:0;font-size:var(--t-13)}
  .sched-body{flex:1;min-width:0}
  .sched-name{font-weight:600;color:var(--ink);font-size:var(--t-base)}
  .sched-sub{font-size:var(--t-13);color:var(--ink-3)}
</style>
</head>
<body>
<div class="app-shell">
  <nav class="icon-rail" id="icon-rail"></nav>

  <div class="main-col">
    <header class="app-header">
      <div>
        <div class="greeting-title">Appointments</div>
        <div class="greeting-sub">Confirm requests and see what's on the schedule.</div>
      </div>
      <div class="header-actions">
        <div class="search-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" placeholder="Search anything…">
        </div>
        <button class="icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        </button>
        <div class="avatar" id="avatar">J</div>
      </div>
    </header>

    <div class="page-body">
      <div class="appt-grid">
        <div class="card">
          <div class="card-head">
            <div class="card-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
              Pending Requests
            </div>
            <span class="badge badge-amber" id="pending-count">0</span>
          </div>
          <div class="card-body" id="pending-body"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
              Schedule
            </div>
          </div>
          <div class="card-body">
            <div class="day-toggle-row">
              <input type="date" class="input" id="cal-date" style="width:auto">
              <span class="muted" style="font-size:var(--t-13)">Click a row to reschedule</span>
            </div>
            <div id="cal-body"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { db } from './lib/data.js';
  db.init();
  import('./modules/appointments.js').then(m => m.renderAppointments());
</script>
</body>
</html>
