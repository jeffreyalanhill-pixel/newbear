<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torklio — Reports</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Reports Center — page-scoped layout. Tabs + hash-routed views. */
  .reports-tabs{margin-bottom:var(--s5);flex-wrap:wrap}
  .rep-sub-nav{margin-bottom:var(--s4)}
</style>
</head>
<body>
<div class="app-shell">
  <nav class="icon-rail" id="icon-rail"></nav>

  <div class="main-col">
    <header class="app-header">
      <div>
        <div class="greeting-title">Reports Center</div>
        <div class="greeting-sub">Sales, labor, inventory, and CRM at a glance.</div>
      </div>
      <div class="header-actions">
        <div class="seg" id="range-toggle">
          <button data-range="7">7d</button>
          <button class="active" data-range="30">30d</button>
          <button data-range="90">90d</button>
          <button data-range="365">1yr</button>
        </div>
        <div class="avatar" id="avatar">J</div>
      </div>
    </header>

    <div class="page-body">
      <div class="seg reports-tabs" id="reports-tabs">
        <button data-view="overview">Overview</button>
        <button data-view="sales">Sales &amp; Financial</button>
        <button data-view="orders">Orders &amp; Invoices</button>
        <button data-view="payments">Payments</button>
        <button data-view="labor">Labor &amp; Technicians</button>
        <button data-view="inventory">Inventory &amp; Vendors</button>
        <button data-view="crm">CRM &amp; Marketing</button>
        <button data-view="rewards">Rewards</button>
      </div>
      <div id="reports-view-body"></div>
    </div>
  </div>
</div>

<script type="module">
  import { db } from './lib/data.js';
  db.init();
  import('./modules/reports/reports-app.js').then(m => m.renderReports());
</script>
</body>
</html>
